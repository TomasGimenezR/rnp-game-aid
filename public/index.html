<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
  <title>R&P! Game Aid</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="alerts">
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
  </div>

  <!-- Login Page -->
  <div class="page" id="loginPage">
    <div class="container login-container">
      <div class="header">
        <img id="rnp-logo" src="imgs/rnp_logo.png" alt="R&P Logo">
        <h1>Virtual Game Aid</h1>
        <div class="status" id="status">Not connected</div>
      </div>
      <div class="login-section">
        <h2>Login</h2>
        <div class="input-group">
          <input type="text" id="usernameInput" placeholder="Enter your username" />
          <button onclick="login()">Login</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Room Selection Page -->
  <div class="page" id="roomsPage" style="display: none;">
    <div class="container rooms-container">
      <div class="header">
        <img id="rnp-logo" src="imgs/rnp_logo.png" alt="R&P Logo">
        <h1>Virtual Game Aid</h1>
        <div class="status" id="statusRooms" style="display: none;">Connected</div>
      </div>

      <div class="rooms-section">
        <h2>Available Rooms</h2>
        <button class="create-room-btn" onclick="openCreateRoomModal()">+ Create New Room</button>
        <div class="rooms-grid" id="roomsList">
          <p style="color: #999; text-align: center;">No rooms available</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Room Page -->
  <div class="page" id="roomPage" style="display: none;">
    <div class="room-container">
  <div class="room-header">
        <button class="leave-button" onclick="confirmLeaveRoom()">← Leave Room</button>
        <div class="room-header-center">
          <h1 id="currentRoomName" class="room-title"></h1>
          <div class="game-mode-indicator" id="gameModeIndicator">
            <span class="mode-label">Mode:</span>
            <span class="mode-value" id="gameModeDisplay">Combat</span>
          </div>
        </div>
        <button class="mode-toggle-btn" id="modeToggleBtn" onclick="toggleGameMode()">Toggle Mode</button>
      </div>

      <div class="hope-tracker-bar">
        <span class="hope-label">Hope:</span>
        <span class="hope-value" id="hopeTracker">0</span>
      </div>

      <div class="room-content">
        <div class="chat-section">
          <h3>Messages</h3>
          <div class="messages" id="messages"></div>
          <div class="message-input">
            <input type="text" id="messageInput" placeholder="Type a message..." />
            <button onclick="sendMessage()">Send</button>
          </div>
        </div>

        <div class="actions-section">
          <div class="action-group">
            <h4>Roll</h4>
            <button onclick="actionRoll()" class="primary-btn">Action Roll!</button>
            <button onclick="forcedRoll()" class="primary-btn">Forced Roll!</button>
            <button onclick="resetDicePool()" class="full-width-btn">Reset Dice Pool</button>
          </div>

          <div class="action-group">
            <h4>Dice</h4>
            <button onclick="replaceForRedDie()" class="accent-btn">🟨 ▶ 🟥</button>
            <button onclick="replaceForBlackDie()" class="accent-btn">🟨 ▶ ⬛</button>
            <button onclick="addRedDie()" class="accent-btn">+🟥</button>
            <button onclick="addBlackDie()" class="accent-btn">+⬛</button>
            <button onclick="subtractRedDie()" class="accent-btn">-🟥</button>
            <button onclick="subtractBlackDie()" class="accent-btn">-⬛</button>
            <button onclick="setDice()" class="accent-btn">Set Dice Pool</button>
          </div>

          <div class="action-group">
            <h4>Hope</h4>
            <button onclick="spendHope()">Spend Hope</button>
            <button onclick="addOneHope()">+1 Hope</button>
            <button onclick="setHope()">Set Hope</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create Room Modal -->
  <div id="createRoomModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Room</h2>
        <button class="modal-close" onclick="closeCreateRoomModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="text" id="roomNameInput" placeholder="Enter room name" class="modal-input" />
      </div>
      <div class="modal-footer">
        <button class="modal-btn-cancel" onclick="closeCreateRoomModal()">Cancel</button>
        <button class="modal-btn-submit" onclick="createRoom()">Create Room</button>
      </div>
    </div>
  </div>

  <!-- Hero Name Modal -->
  <div id="heroNameModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Enter Hero Name</h2>
      </div>
      <div class="modal-body">
        <input type="text" id="heroNameInput" placeholder="Enter your hero's name" class="modal-input" />
      </div>
      <div class="modal-footer">
        <button class="modal-btn-cancel" onclick="cancelJoinRoom()">Cancel</button>
        <button class="modal-btn-submit" onclick="confirmHeroName()">Join Room</button>
      </div>
    </div>
  </div>

  <!-- Leave Confirmation Modal -->
  <div id="leaveConfirmModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Leave Room?</h2>
      </div>
      <div class="modal-body">
        <p>Are you sure you want to leave this room?</p>
      </div>
      <div class="modal-footer">
        <button class="modal-btn-cancel" onclick="closeLeaveConfirmModal()">Cancel</button>
        <button class="modal-btn-submit" onclick="leaveRoom()">Leave Room</button>
      </div>
    </div>
  </div>

  <!-- Dice Pool Modal -->
  <div id="diceModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Set Dice Pool</h2>
        <button class="modal-close" onclick="closeDiceModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="dice-input-group">
          <label for="heroInput">🟨 Hero Dice:</label>
          <input type="number" id="heroInput" min="0" max="20" value="0">
        </div>
        <div class="dice-input-group">
          <label for="redInput">🟥 Red Dice:</label>
          <input type="number" id="redInput" min="0" max="20" value="0">
        </div>
        <div class="dice-input-group">
          <label for="blackInput">⬛ Black Dice:</label>
          <input type="number" id="blackInput" min="0" max="20" value="0">
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn-cancel" onclick="closeDiceModal()">Cancel</button>
        <button class="modal-btn-submit" onclick="submitDicePool()">Set Dice Pool</button>
      </div>
    </div>
  </div>

  <script src="client.js"></script>
</body>
</html>
